name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install release tools
        run: python -m pip install build twine packaging

      - name: Test release guard
        run: python -m unittest discover -s tests -p test_release.py -v

      - name: Verify tag and require a newer PyPI version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_release.py

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check --strict dist/*

      - name: Store distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install version comparison tool
        run: python -m pip install packaging

      - name: Retrieve distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Recheck PyPI immediately before publication
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_release.py

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

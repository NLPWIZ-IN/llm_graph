name: Build and Test

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Mermaid validation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Python package and validation tools
        run: python -m pip install ".[dev,release]"

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Type-check source
        run: python -m pyright --pythonpath "$(python -c 'import sys; print(sys.executable)')"

      - name: Build source archive and wheel
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Install built wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Run complete test suite against installed wheel
        run: python -m unittest discover -s tests -v
